# Запуск всего стека: docker compose up -d --build
# Перед запуском: cp .env.docker.example .env.docker и заполнить значения.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zurbash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env.docker}
      POSTGRES_DB: zurbash
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zurbash"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env.docker
    environment:
      DATABASE_URL: postgres://zurbash:${POSTGRES_PASSWORD}@db:5432/zurbash
    # схема и курс применяются при каждом старте (скрипт безопасен для повторного запуска)
    command: sh -c "node scripts/setup-db.mjs && npm start"
    ports:
      - "3000:3000"

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      web: { condition: service_started }
    env_file: .env.docker
    environment:
      DATABASE_URL: postgres://zurbash:${POSTGRES_PASSWORD}@db:5432/zurbash
    command: node scripts/bot.mjs

volumes:
  dbdata:
