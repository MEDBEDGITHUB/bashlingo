# Запуск всего стека: docker compose up -d --build
# Перед запуском: cp .env.docker.example .env.docker и заполнить значения (в том числе DOMAIN).
# Сайт слушает 127.0.0.1:${WEB_PORT} (по умолчанию 3000), наружу он не торчит.
# Свободны 80 и 443: запускайте с Caddy (он сам делает HTTPS):  docker compose --env-file .env.docker --profile caddy up -d --build
# Заняты (например, свой nginx): запускайте без профиля и проксируйте свой HTTPS на 127.0.0.1:${WEB_PORT}.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zurbash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env.docker}
      POSTGRES_DB: zurbash
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zurbash"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env.docker
    environment:
      DATABASE_URL: postgres://zurbash:${POSTGRES_PASSWORD}@db:5432/zurbash
      PUBLIC_URL: https://${DOMAIN}
    # схема и курс применяются при каждом старте (скрипт безопасен для повторного запуска)
    command: sh -c "node scripts/setup-db.mjs && npm start"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["caddy"]
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env.docker}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      web: { condition: service_started }
    env_file: .env.docker
    environment:
      DATABASE_URL: postgres://zurbash:${POSTGRES_PASSWORD}@db:5432/zurbash
      PUBLIC_URL: https://${DOMAIN}
    command: node scripts/bot.mjs

volumes:
  dbdata:
  caddy_data:
  caddy_config:
